<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>通用擷取 v3 — 沙盒</title>
<style>
:root{
  --bg:#fff; --fg:#1c2430; --mute:#5b6672; --faint:#9aa3ad;
  --line:#d7dce2; --panel:#f2f4f6; --btn:#e3e7ec;
  --red:#c8102e; --green:#0a8f3c; --blue:#0a66c2; --orange:#e8590c;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
     color:var(--fg);background:var(--bg);line-height:1.6}

/* ---------- 沙盒 chrome ---------- */
header.sandbox{position:sticky;top:0;z-index:100;display:flex;gap:18px;align-items:center;
  padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);font-size:14px}
header.sandbox .sp{flex:1}
header.sandbox label{display:flex;gap:8px;align-items:center;cursor:pointer;user-select:none}
.switch{position:relative;display:inline-block;width:2.6rem;height:1.3rem;flex:0 0 auto}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .track{position:absolute;inset:0;background:#c3cad2;border-radius:1rem;transition:background .18s}
.switch .thumb{position:absolute;top:2px;left:2px;width:calc(1.3rem - 4px);height:calc(1.3rem - 4px);
  background:#fff;border-radius:50%;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked + .track{background:var(--green)}
.switch input:checked + .track .thumb{transform:translateX(1.3rem)}
select{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:#fff}
.hint{color:var(--mute);font-size:13px}

main{padding:24px 18px 60vh;max-width:820px}

/* ---------- 教學說明 ---------- */
#guide{margin:22px 18px 0;max-width:720px;border:1px solid var(--line);
  border-left:3px solid var(--blue);border-radius:10px;background:var(--panel);padding:11px 16px 13px}
#guide .ghead{display:flex;gap:9px;align-items:baseline;margin-bottom:2px}
#guide .ghead .sp{flex:1}
#guide .ghead .gname{color:var(--mute);font-size:12.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
#guide p{margin:7px 0;font-size:13.5px}
#guide ul,#guide ol{margin:7px 0;padding-left:1.4em;font-size:13.5px}
#guide li{margin:2px 0}
#guide code{font-family:var(--mono);font-size:12px;background:var(--bg);
  border:1px solid var(--line);border-radius:4px;padding:0 4px}
#guide .ps{color:var(--mute);font-size:12.5px}
#guide .kw{font-weight:700}
#guide .kw.g{color:var(--green)}
#guide .kw.b{color:var(--blue)}
#guide .kw.r{color:var(--red)}
#guide.min #guide-body{display:none}

/* ---------- 乾淨 fixture ---------- */
.panel-box{max-width:720px;border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.panel-box h2{margin:0 0 2px;font-size:1.05rem}
.panel-note{color:var(--mute);font-size:13px;margin-bottom:12px}
.grid{display:flex;gap:28px}
.col{list-style:none;margin:0;padding:0;flex:1}
.item{margin:0 0 6px}
.card{border:1px solid var(--line);border-radius:8px}
.link{display:block;padding:8px 12px;text-decoration:none;color:var(--fg)}
.link:hover{background:var(--panel)}

/* ---------- google fixture 讓它有形狀 ---------- */
#fx .EIaa9b{display:flex;gap:20px}
#fx .M6HR1c{font-weight:700;margin-bottom:10px}
#fx .AJLUJb{flex:1}
#fx .b2Rnsc{margin-bottom:6px}
#fx .ngTNl{display:block;padding:8px 12px;border:1px solid var(--line);border-radius:8px;
  text-decoration:none;color:var(--fg)}
#fx .B2VR9{display:flex;align-items:center;gap:8px}
#fx .wyccme{flex:1}
#fx .mgAbYb{font-weight:700;font-size:1.05rem}
#fx svg{width:16px;height:16px;fill:var(--mute)}

/* ---------- 案例二:鋪滿整列的連結 ---------- */
table.rows{border-collapse:collapse;width:100%;max-width:640px}
table.rows th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;
  padding:6px 10px;border-bottom:1px solid var(--line)}
table.rows tr.row{position:relative}
table.rows td{padding:9px 10px;border-bottom:1px solid var(--line)}
table.rows tr.row:hover{background:var(--panel)}
a.stretch{position:absolute;inset:0;display:block}

/* ---------- 案例一:裝飾層 ---------- */
.demo{margin-bottom:26px}
.demo > h2{font-size:.95rem;margin:0 0 8px;color:var(--mute);font-weight:600}
.list{list-style:none;margin:0;padding:0;max-width:420px}
.list .item{margin-bottom:6px}
.list .t{display:block;padding:8px 12px;border:1px solid var(--line);border-radius:8px;
  text-decoration:none;color:var(--fg)}
.list .promo{border-left:3px solid #e8590c;padding-left:6px}
.list .badge{border-left:3px solid #0a66c2;padding-left:6px}
.feed{max-width:420px}
.feed .post{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:6px}
.feed .post h3{margin:0;font-size:.95rem}
.feed .post .meta{margin:2px 0 0;font-size:12px;color:var(--mute)}
.feed .promo{border-left:3px solid #e8590c;padding-left:6px;margin-bottom:6px}
.feed .ad{border:1px dashed var(--line);border-radius:8px;padding:8px 12px;
  font-size:12px;color:var(--mute)}


/* ---------- 案例四:影片卡片(三類欄位測試) ---------- */
.cards{list-style:none;margin:0;padding:0;max-width:460px}
.cards .vc{border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:8px}
.cards .vt{text-decoration:none;color:var(--fg);font-weight:700;font-size:1rem}
.cards .row{display:flex;gap:10px;color:var(--mute);font-size:12px;margin-top:3px}
.cards .m{font-size:12px;color:var(--mute)}
.cards .m div,.cards .m span{display:inline}
.cards .sr{display:none}
.cards svg{width:14px;height:14px;fill:var(--faint);vertical-align:middle}

/* ---------- 2D 擷取 modal(§15) ----------
   <dialog> 進 top layer,不吃 z-index 競賽 —— 面板靠 2147483200 硬頂,任何後插入
   且同樣開到最大值的頁面元素都會贏過它。不能用 all:unset,那會破壞 top layer 定位。 */
#gp-dlg{padding:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);
  color:var(--fg);font:inherit;font-size:13px;width:min(760px,92vw);max-height:80vh;
  box-shadow:0 12px 48px rgba(0,0,0,.32)}
#gp-dlg[open]{display:flex;flex-direction:column}
#gp-dlg::backdrop{background:rgba(0,0,0,.34)}
#gp-dlg .dhead{flex:0 0 auto;display:flex;gap:10px;align-items:center;padding:8px 12px;
  background:var(--panel);border-bottom:1px solid var(--line)}
#gp-dlg .dhead .sp{flex:1}
#gp-dlg .dsample{flex:0 0 auto;display:flex;gap:6px;align-items:center;
  padding:7px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mute)}
#gp-dlg .dtree{flex:1 1 auto;overflow:auto;padding:9px 12px;min-height:130px}
#gp-dlg .dprev{flex:0 0 auto;max-height:30vh;overflow:auto;
  border-top:1px solid var(--line);padding:8px 12px}
#gp-dlg .dfoot{flex:0 0 auto;display:flex;gap:10px;align-items:center;
  border-top:1px solid var(--line);background:var(--panel);padding:7px 12px}
#gp-dlg .dfoot .sp{flex:1}
#gp-dmsg{color:var(--orange);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.samp{font:inherit;font-size:12px;line-height:1;padding:4px 8px;border:1px solid var(--line);
  border-radius:5px;background:var(--btn);color:var(--fg);cursor:pointer}
.samp.on{background:var(--red);border-color:var(--red);color:#fff}
.sect{display:flex;gap:5px;align-items:center;font-size:11px;color:var(--faint);
  margin:11px 0 3px;letter-spacing:.06em}
.secfold{font-family:var(--mono);font-size:13px;line-height:1;cursor:pointer;user-select:none;
  width:1em;text-align:center}
.secfold:hover{color:var(--blue)}
.sect.first{margin-top:0}
.dnote{display:block;font-size:11px;color:var(--faint);margin:0 0 7px}
.dnote.hid{cursor:pointer;user-select:none}
.dnote.hid:hover{color:var(--blue)}
/* 常數列展開後仍標示出來 —— 它為什麼原本被藏起來,要看得出來 */
.frow.konst .ft{color:var(--mute);font-style:italic}
.frow{display:flex;gap:7px;align-items:center;padding:2px 3px;border-radius:4px;min-height:21px}
.frow:hover{background:var(--panel)}
/* dim 套在各部件而不是整列 —— 收合的 blob 靠 .cn 的欄號說明「我收著但有貢獻欄位」,
   那是唯一的線索,不能跟著互斥的灰一起被壓掉。 */
.frow.dis input,.frow.dis .ft,.frow.dis .ak,.frow.dis .star,.frow.dis .bdg{opacity:.34}
.frow input{margin:0;flex:0 0 auto}
.frow .ft{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .ft.empty{color:var(--faint);font-style:italic}
.frow .ak{font-family:var(--mono);font-size:11px;color:var(--faint);flex:0 0 auto}
.frow .star{font-family:var(--mono);color:var(--faint);flex:0 0 auto}
.frow .star.fold{cursor:pointer;user-select:none;width:1em;text-align:center;font-size:13px}
.frow .star.fold:hover{color:var(--blue)}
.frow .cn{font-size:11px;color:var(--blue);flex:0 0 auto;min-width:1.3em;text-align:right}
.bdg{font-family:var(--mono);font-size:11px;flex:0 0 auto;color:var(--green);width:4.6em;text-align:right}
.bdg.part{color:#b07d09}
.bdg.multi{color:var(--orange)}
/* 切點:斷點不是點縫隙 —— 葉子可以不連續勾選,縫隙會被未勾選的列擋住。
   實線 = 從這裏開新欄;虛線 = 併入前一欄;第一片已勾選的葉子鎖死為開欄。 */
.cut{font-family:var(--mono);font-size:13px;flex:0 0 auto;width:1em;margin-left:15px;
  color:var(--blue);cursor:pointer;user-select:none;line-height:1}
.cut.soft{color:var(--faint)}
.cut.lock{cursor:default;opacity:.5}
.cut.off{color:transparent;cursor:default}
table.pv{border-collapse:collapse;font-size:11px}
table.pv td{border:1px solid var(--line);padding:2px 6px;font-family:var(--mono);
  max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pvempty{color:var(--faint);font-size:12px}

/* ---------- 工具 overlay ----------
   綠 = 完全在外;藍 = 騎在邊框上;紅 = 內填色(不畫線)。三種不同編碼,不是三個同心環。 */
#gp-overlay{position:fixed;inset:0;pointer-events:none;z-index:2147483000}
#gp-overlay .bx{position:fixed;pointer-events:none}
.bx.hover{border:2px dashed var(--orange);background:rgba(232,89,12,.07)}
.bx.green{outline:3px solid var(--green);outline-offset:3px;border-radius:3px}
.bx.blue{border:2px solid var(--blue)}
/* 畫布只畫一個狀態:有預覽時藍框就是預覽後的集合,實線直接搬過去。
   虛線增刪那套視覺語言認知負荷太高,不做預設。 */
/* 紅框 overlay 自己就是移除按鈕:唯一能穩定控制游標的方式 —— 把 cursor 設在頁面
   元素上會被它自己的樣式蓋過(紅框多半是 <a>,a{cursor:pointer} 直接贏)。
   順帶補掉一個洞:swallow 與 onClick 都只在 picking() 時作用,所以調校階段左鍵
   點在紅框上,若那是連結會直接導航離開。overlay 吃掉點擊之後就不會了。 */
/* 選擇器要吃得贏 `#gp-overlay .bx` 的 pointer-events:none —— 那條是 (1,1,0) */
#gp-overlay .bx.red{background:rgba(200,16,46,.12);pointer-events:auto;cursor:not-allowed}
#gp-tip{position:fixed;z-index:2147483100;pointer-events:none;display:none;
  font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:4px;
  background:#1c2430;color:#fff;white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis}

/* ---------- 面板 ---------- */
#gp-panel{position:fixed;right:16px;bottom:16px;z-index:2147483200;display:none;
  width:min(880px,64vw);max-height:70vh;background:var(--bg);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.22);font-size:13px;
  flex-direction:column;overflow:hidden}
#gp-panel.on{display:flex}
#gp-panel .head{display:flex;gap:10px;align-items:center;padding:7px 12px;cursor:all-scroll;
  background:var(--panel);border-bottom:1px solid var(--line);user-select:none}
#gp-panel .head .sp{flex:1}
#gp-panel .body{flex:1 1 auto;overflow:auto;padding:0}
#gp-panel .foot{flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel);
  padding:7px 12px;display:flex;gap:10px;align-items:center}
#gp-panel .foot .sp{flex:1}
#gp-panel.min .body,#gp-panel.min .foot{display:none}
button.gp{font:inherit;font-size:12px;line-height:1;padding:5px 9px;border:1px solid var(--line);
  border-radius:5px;background:var(--btn);color:var(--fg);cursor:pointer}
button.gp:hover:not(:disabled){background:#d5dbe2}
button.gp:disabled{opacity:.45;cursor:default}

/* ---------- 第 1 列:兩條軌道 ----------
   上軌 = 每一節的鬆緊(能不能按、配對一筆還是多筆)。
   下軌 = 綠框與紅框的邊界(現在在哪、原本在哪、可以搬去哪)。
   一個問題只在一條軌道上回答 —— 上軌不再兼差表達「在不在查詢式裏」,
   所以它只需要「灰 = 不能按 / 藍 = 能按」兩種顏色,沒有空心、沒有虛線、沒有第三色。
   不做坍縮,改用橫向捲軸。 */
#gp-rowwrap{overflow-x:auto;overflow-y:hidden;padding:12px;border-bottom:1px solid var(--line)}
#gp-rowwrap::-webkit-scrollbar{height:7px}
#gp-rowwrap::-webkit-scrollbar-thumb{background:#c9d0d8;border-radius:4px}
/* grid + auto-flow:column 讓上下軌自動同欄對齊,欄寬由上軌撐開 ——
   不需要為了對齊而手算寬度,分岔區把上軌那一列撐高時下軌仍是一條直線。 */
/* pill 貼齊上軌底部、sb 貼齊下軌頂部 —— 兩者永遠只隔一個 row-gap,
   「哪顆按鈕屬於哪顆 pill」不需要靠眼睛拉一條長垂直線。
   分岔跨兩軌(grid-row:span 2)而不是只佔上軌:grid 把跨軌項目的多餘空間
   平均分給兩條 auto 軌,於是 r1 = 24 + E/2、r2 = 12 + E/2,pill+sb 這一叢的
   中心正好落在容器正中。只佔上軌的話 E 全灌進 r1,整叢會被壓到容器下緣。 */
#gp-row{display:grid;grid-auto-flow:column;grid-template-rows:auto auto;
  align-items:end;column-gap:3px;row-gap:5px;width:max-content}

/* ── 上軌 ── */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:3px;
  font-family:var(--mono);font-size:12px;height:24px;padding:0 6px;border-radius:5px;
  background:#dde2e8;color:var(--mute)}
.pill.on{padding:0 2px}
.pill .tag{pointer-events:none}
/* 序號片:實心藍且有數字 = 套用 predicate;實心藍留空 = 沒有 predicate。
   寬度兩態相同 —— 切換 predicate 不該讓整列重排。 */
.pill .ix{display:inline-flex;align-items:center;justify-content:center;
  min-width:18px;height:18px;padding:0 3px;border-radius:4px;cursor:pointer;
  background:var(--blue);color:#fff;font-size:11px}
.pill .ix:hover{box-shadow:0 0 0 2px rgba(10,102,194,.22)}
/* 抽象:整顆 pill 就是那個方塊。1 = 配對一筆,* = 配對多筆,同一個語意軸。 */
.pill.abs{min-width:24px;padding:0 4px}
.pill.abs.on{background:var(--blue);color:#fff;cursor:pointer}
.pill.abs.on:hover{box-shadow:0 0 0 2px rgba(10,102,194,.22)}

/* ── 下軌:高度是上軌的一半 ──
   實心 = 框現在在這裏(不可點);空心 = 點一下把框搬過來。
   綠邊／紅邊空心 = 那個框的原始位置。灰邊不區分綠紅 —— §2 保證兩者可動範圍
   不重疊且首尾相接,位置本身就是答案,再上色是重複編碼。 */
.sb{align-self:start;height:12px;border-radius:3px;border:1px solid #c3cad2;background:var(--bg);cursor:pointer}
.sb.ghome{border-color:var(--green)}
.sb.rhome{border-color:var(--red)}
.sb:hover{border-color:var(--blue);box-shadow:0 0 0 2px rgba(10,102,194,.18)}
.sb.cur{cursor:default;pointer-events:none}
.sb.cur.g{background:var(--green);border-color:var(--green)}
.sb.cur.r{background:var(--red);border-color:var(--red)}
/* 分岔區沒有停靠點:各分支在那幾層的標籤本來就不一致,對不齊就不該有按鈕。
   分岔自己跨兩軌,不需要佔位元素;.nostop 只留給「有 pill 但該層不可停」
   這個罕見情形(實測五個 fixture 都沒發生),讓後面的欄不會錯位到下軌。 */
.nostop{align-self:start;height:12px}

/* 分岔:同一列局部裂成兩線再合回來(捷運路線圖),不需要符號或圖例。
   分歧槽即使沒有分岔也存在 —— ＋ 必須永遠在,否則沒有分岔時就長不出第一條岔路。 */
.fork{grid-row:span 2;align-self:center;display:inline-flex;flex-direction:column;gap:3px;
  border-left:2px solid var(--faint);border-right:2px solid var(--faint);
  border-radius:6px;padding:3px 5px;margin:0 2px}
.fork.bare{border-color:transparent;padding:3px 1px}
.branch{display:inline-flex;align-items:center;gap:3px}
.branch .empty{font-size:11px;color:var(--faint);font-family:var(--mono)}
/* 刪除而不是停用:停用會讓樣本掉到 1 個,破壞「至少選兩個」的規則 */
.btrash{font-size:11px;line-height:1;padding:1px 3px;border-radius:4px;cursor:pointer}
.btrash:hover{background:rgba(10,102,194,.18)}
.btrash.dead:hover{background: none}
.btrash.dead{cursor: default; opacity: 0.5}
.bplus{align-self:center;font-size:11px;line-height:1;color:var(--mute);cursor:pointer;
  border:1px solid var(--line);border-radius:4px;padding:2px 7px;margin-top:1px;background:var(--bg)}
.bplus:hover{color:var(--blue);border-color:var(--blue);box-shadow:0 0 0 2px rgba(10,102,194,.18)}
.bplus.armed{color:var(--blue);border-color:var(--blue);box-shadow:0 0 0 2px rgba(10,102,194,.18)}

/* ---------- 預覽列表 = 差異檢視器 ----------
   消失的列位置保留不重排,否則整份列表會跳動、眼睛得重找位置。 */
#gp-list{padding:6px 12px 10px}
.lrow{display:flex;gap:7px;align-items:baseline;padding:2px 4px}
.lrow .aim{font-size:11px;color:var(--faint);cursor:pointer;width:1rem;text-align:center;line-height:1.4}
.lrow .aim:hover{color:var(--blue);box-shadow:0 0 0 2px rgba(10,102,194,.18)}
.lrow .li{font-family:var(--mono);font-size:11px;color:var(--faint);text-align:right;flex:0 0 auto}
.lrow .lt{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .lt.empty{color:var(--red);font-style:italic}
.lrow.ex{background:rgba(200,16,46,.07)}
.lrow.add{background:rgba(10,102,194,.13)}
.lrow.drop{opacity:.4}
.lrow.drop .lt{text-decoration:line-through}
.lmore{display:block;font-size:11px;color:var(--faint);padding:3px 4px}

#gp-count{white-space:nowrap;font-weight:700;color:var(--blue)}
#gp-count.pv{color:var(--orange)}
#gp-msg{color:var(--orange);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>

<header class="sandbox">
  <label>
    <span class="switch"><input type="checkbox" id="tool-on"><span class="track"><span class="thumb"></span></span></span>

<template id="gd-anc">
<p>這個案例可以體驗兩大功能：一是<b>移動共同祖先層級</b>(畫面上的<span class="kw g">綠框</span>)，二是<b>調整節點寬鬆程度</b>(面板上排的<span class="kw b">藍色方塊</span>)。</p>
<p>當你用紅框取樣同一側的兩個項目(例如左一、左二)，面板下排就會出現代表共同祖先的<span class="kw g">綠色方塊</span>;往左按一格，祖先層級就往上調一層(爺爺 → 曾祖父)。</p>
<p>節點寬鬆程度則是<span class="kw b">藍色方塊</span>，只要出現就能點擊切換：</p>
<ul>
  <li><code>1</code> — 嚴謹配對，同層級的同一個位置只抓一筆</li>
  <li><code>*</code> — 寬鬆配對，同層級全部都抓</li>
</ul>
</template>

<template id="gd-stretch">
<p>這個案例可以體驗<b>調整紅框層級</b>。</p>
<p>紅框取樣完之後，假如面板下方的預覽列整排都呈現為空，有很高的機率是取樣在錯誤的層級 —— 資料存在於父層，但畫面上卻選不到父層。</p>
<p>這個問題可以透過移動樣本層級解決：找到下排代表樣本的<span class="kw r">紅色方塊</span>，往左按一格即可調高樣本層級。</p>
</template>

<template id="gd-deco">
<p>這個案例可以體驗<b>分歧點</b>。</p>
<p>當紅框取樣的兩個元素具備相同的末端結構，起點卻有不一樣的輪廓，這時工具會自動產生分歧點，將兩個查詢式的結果取聯集。</p>
<p class="ps">p.s. 本案例有用左側橘線表現兩者的結構差異，但分歧點也有可能出現在兩個視覺一致的樣本上。</p>
</template>

<template id="gd-union">
<p>這個案例可以體驗<b>分歧點</b>，以及<b>新增多個樣本</b>。</p>
<p>因為分歧點的運作原理是直接取聯集，只要使用者願意，可以按加號新增數個輪廓的樣本。</p>
<p>當樣本數超過兩個後，也可以透過垃圾桶圖示刪除不要的樣本。</p>
</template>

<template id="gd-card">
<p>這個案例可以體驗 <b>2D 擷取</b>功能。工具預設是擷取一維資料，倘若樣本圈選在複雜結構，使用者可以透過「2D 擷取」展開額外面板，做更細緻的分欄處理。</p>
<p>工具會將樣本中的文字拆成三大類，並透過核取方塊，讓使用者決定要擷取哪些資料;勾選後可以在面板下方查看分欄情況：</p>
<ol>
  <li>看得見的簡單欄位</li>
  <li>看得見的複雜文字</li>
  <li>看不到的文字</li>
</ol>
<p>其中第二類「複雜文字」存在額外標記(例如 <code>這題重要&lt;em&gt;畫起來&lt;/em&gt;，考試會考</code>)，工具提供使用者做進階的分欄處理：可以自行決定這段文字應該用空白分隔成一欄，或是拆到三個獨立欄位。</p>
</template>

  cells.push([dimPill(G.strip.find(s => s.k === G.gUp).el), stopBtn('g', G.gUp)]);
  /* NCA 鏈 */
  G.chainNodes.forEach(n => cells.push([pillEl(n), stopBtn('g', n.k)]));

  /* 分歧槽:即使目前沒有分岔也存在。plus 必須永遠在 ——
     「漏抓就再點一個樣本」正是要在沒有分岔時把第一條岔路生出來。 */
  const fk = el('fork' + (G.fork ? '' : ' bare'));
  if (G.fork) G.branches.forEach((b, bi) => {
    const br = el('branch');
    const dead = examples.length - b.exs.length < 2;
    const tr = el('btrash' + (dead ? ' dead' : ''), '🗑');
    tr.title = dead ? '至少要留兩個樣本' : '刪掉這條走法(連同它的樣本)';
    if (!dead) {
      tr.addEventListener('mouseenter', () => { if (armed()) { const r = matchesWithout(bi); if (r) setPreview(r); } });
      tr.addEventListener('mouseleave', clearPreview);
      tr.addEventListener('click', () => {
        const drop = new Set(b.exs);
        examples = examples.filter((_, i) => !drop.has(i));
        moved = false; clearPreview(); rebuild();
      });
    }
    br.appendChild(tr);
    if (!b.nodes.length) br.appendChild(el('empty', '（直接）'));
    b.nodes.forEach(n => br.appendChild(pillEl(n)));
    fk.appendChild(br);
  });
  const plus = el('bplus' + (phase === 'add' ? ' armed' : ''), '＋');
  plus.title = '再次透過紅框取樣,長出一條新的走法';
  plus.addEventListener('click', () => {
    phase = phase === 'add' ? 'tune' : 'add'; pendingDestructive = null; render();
  });
  fk.appendChild(plus);
  cells.push([fk, null]);   /* 分岔跨兩軌,不配下軌元素 */

  /* 共同結尾 → 紅框 */
  G.sufNodes.forEach(n => cells.push([pillEl(n), G.stops.includes(n.r) ? stopBtn('r', n.r) : el('nostop')]));
  /* 紅框以下 */
  const o0 = examples[0].origin;
  for (let r = G.rUp - 1; r >= 0; r--)
    cells.push([dimPill(ancAt(o0, r)), G.stops.includes(r) ? stopBtn('r', r) : el('nostop')]);

  for (const [top, bot] of cells) { rowEl.appendChild(top); if (bot) rowEl.appendChild(bot); }
}

/* 不坍縮之後第 1 列可能很長,查詢式本體會被推到捲軸外 —— 每次重畫把它捲回來 */
function scrollQueryIntoView() {
  const g = rowEl.querySelector('.sb.cur.g'), r = rowEl.querySelector('.sb.cur.r');
  if (!g || !r) return;
  const w = wrapEl.getBoundingClientRect();
  const a = g.getBoundingClientRect().left, b = r.getBoundingClientRect().right;
  if (a < w.left + 10) wrapEl.scrollLeft -= (w.left + 10 - a);
  else if (b > w.right - 10) wrapEl.scrollLeft += Math.min(b - (w.right - 10), a - (w.left + 10));
}

/* 內容基底的 diff:列表是抽取結果的預覽,就該用抽取結果來 diff。
   用節點身分比對的話,紅框從 span 移到它的 a,8 個元素全換但每列文字一模一樣,
   畫面上會出現 8 刪 8 增的假變化。 */
function buildRows() {
  if (!preview) return matched.map(e => ({ el: e, kind: 'keep' }));
  const A = matched.map(getTxt), B = preview.map(getTxt);
  if (A.length === B.length && A.every((t, i) => t === B[i]))
    return preview.map(e => ({ el: e, kind: 'keep' }));
  const pool = new Map();
  A.forEach(t => pool.set(t, (pool.get(t) || 0) + 1));
  const rows = [];
  preview.forEach((e, i) => {
    const t = B[i];
    if (pool.get(t) > 0) { pool.set(t, pool.get(t) - 1); rows.push({ el: e, kind: 'keep' }); }
    else rows.push({ el: e, kind: 'add' });
  });
  const rem = new Map(pool);
  matched.forEach((e, i) => {
    const t = A[i];
    if (rem.get(t) > 0) { rem.set(t, rem.get(t) - 1); rows.push({ el: e, kind: 'drop' }); }
  });
  rows.sort((x, y) => docOrder(x.el, y.el));
  return rows;
}

function renderCount() {
  const c = $('#gp-count');
  if (!G) { c.textContent = ''; c.classList.remove('pv'); return; }
  if (!preview) { c.textContent = '共 ' + matched.length + ' 筆'; c.classList.remove('pv'); return; }
  const rows = buildRows();
  const changed = rows.some(r => r.kind !== 'keep');
  c.classList.add('pv');
  /* 兩邊抽出來的東西一樣時連箭頭都不顯示 ——「這個動作不改變你抽到的東西」
     本身就是使用者最想知道的答案 */
  c.textContent = changed ? '共 ' + matched.length + ' 筆 → ' + preview.length + ' 筆'
                          : '共 ' + matched.length + ' 筆 · 無變化';
}

function renderList() {
  listEl.replaceChildren();
  if (!G) return;
  const rows = buildRows();
  const exs = new Set(G.reds);
  rows.slice(0, LIST_N).forEach((r, i) => {
    const row = el('lrow' + (r.kind === 'keep' ? '' : ' ' + r.kind) + (exs.has(r.el) ? ' ex' : ''));
    const aim = el('aim', '◎');
    aim.title = '捲到這個元素';
    aim.addEventListener('click', () => r.el.scrollIntoView({ block:'center', behavior:'smooth' }));
    row.appendChild(aim);
    row.appendChild(el('li', String(i + 1)));
    const t = getTxt(r.el);
    row.appendChild(el('lt' + (t ? '' : ' empty'), t ? clip(t, 90) : '(空)'));
    listEl.appendChild(row);
  });
  if (rows.length > LIST_N) listEl.appendChild(el('lmore', '⋯ 還有 ' + (rows.length - LIST_N) + ' 筆'));
}

/* 幾何失敗與定址失敗都必須出聲 —— §13 的「命中 0 不可能」只涵蓋查詢式求值 */
function stateMsg() {
  if (!on || examples.length < 2) return '';
  if (!G) return '這些元素在任何一層都對不齊,無法建立查詢式 — 點紅框可移除重選';
  if (matched.length < examples.length)
    return '有元素無法用 XPath 定址(多半是 SVG 內部) — 點紅框可移除重選';
  return '';
}

function render() {
  $('#gp-phase').textContent =
    phase === 'select' ? '框選中 ' + examples.length + '/2'
    : phase === 'add' ? '點一個要加入的樣本'
    : phase === 'tune' ? '調校中' : '';
  $('#phase-hint').textContent = !on ? '關閉中'
    : phase === 'select' ? '點兩個看起來同一類的東西'
    : phase === 'add' ? '點一個目前沒抓到的同類元素'
    : '下排方塊調整錨點範圍 · 上排方塊調整配對寬鬆 · 點紅框可移除';
  $('#btn-abstract').textContent = abstract ? '簡明模式' : '工程宅模式';
  $('#btn-abstract').title = abstract ? '目前隱藏標記名 — 點一下顯示' : '目前顯示標記名 — 點一下隱藏';
  $('#btn-txtmode').textContent = TXTMODES[txtMode].label;
  $('#btn-txtmode').title = TXTMODES[txtMode].tip;
  const ready = !!G;
  $('#btn-copy').disabled = !ready; $('#btn-extract').disabled = !ready;
  $('#btn-2d').disabled = !can2d;
  $('#btn-2d').title = can2d ? '把一維資料拆成多欄位'
    : ready ? '這個紅框只抓得到一欄 — 沒有可分的欄位' : '';
  $('#gp-msg').textContent = toastMsg || stateMsg();
  renderRow(); renderCount(); renderList(); scrollQueryIntoView();
}

/* ═════════ 重算 ═════════ */
function rebuild() {
  preview = null;
  G = computeGeom(greenUp, redUp);
  if (G) { greenUp = G.gUp; redUp = G.rUp; analyze(G); matched = runOf(G); }
  else matched = [];
  /* 啟用條件直接跑真正的分類器,不是 v2 警告的那種 proxy 預判 ——
     算出 0 或 1 列就代表 modal 打開也真的沒東西可分。成本只有樣本紅框一顆的子樹。 */
  can2d = false;
  if (G) { const c = classify(G.reds[sampleIx()]); can2d = c.count >= 2; }
  if (phase === 'tune' && examples.length < 2) phase = 'select';
  rebuildBoxes(); render();
}
function resetAll() {
  examples = []; overrides.clear();
  redUp = 0; greenUp = 0; G = null; matched = []; preview = null;
  hoverEl = null; pendingDestructive = null; toastMsg = ''; lastPicked = null;
  if (dlg.open) dlg.close();
  phase = on ? 'select' : 'idle';
  tipEl.style.display = 'none';
  rebuild();
}

/* 點擊後游標還停在原處,DOM 重建會讓瀏覽器對新元素補送 mouseenter ——
   若不擋,使用者會立刻看到一次反向預覽。必須先移開再回來才算數。 */
addEventListener('mousemove', () => { moved = true; }, true);

/* ═════════ 頁面互動 ═════════ */
const picking = () => phase === 'select' || phase === 'add';
function onMove(e) {
  /* ::backdrop 是虛擬元素不會被回傳,elementFromPoint 可能仍回傳底下的 inert 頁面元素,
     橘框會繼續跟著游標跑。各家瀏覽器對 inert 與 hit test 的處理不一致。 */
  if (dlg.open) return;
  if (!on || !picking()) return;
  const t = pickable(document.elementFromPoint(e.clientX, e.clientY));
  if (!t || UI(t) || t === document.body || t === document.documentElement) {
    hoverEl = null; tipEl.style.display = 'none'; clearPreview(); rebuildBoxes(); return;
  }
  hoverEl = t;
  tipEl.style.display = 'block';
  tipEl.style.left = Math.min(e.clientX + 12, innerWidth - 300) + 'px';
  tipEl.style.top = (e.clientY + 18) + 'px';
  tipEl.textContent = label(t);
  rebuildBoxes();
  if (phase === 'add' && G) {
    const probe = tryAdd(t);
    if (probe) setPreview(probe.matched); else clearPreview();
  }
}
/* 加樣本要不要二次確認。
   不能用「共同結尾有沒有縮短」當判準 —— 還沒有分岔時,任何不同形狀的新樣本都必然
   讓共同結尾縮短,而那正是 union 的主要復原路徑。每次都跳確認等於把警告稀釋掉。
   真正該擋的是「會毀掉東西」:紅框被迫移位,或使用者調過的某顆開關將不復存在。 */
function tryAdd(t) {
  if (examples.some(x => x.origin === t || x.origin.contains(t) || t.contains(x.origin))) return null;
  const m = computeGeom(greenUp, redUp, examples.concat([{ origin: t }]));
  if (!m) return null;
  const keys = new Set(m.nodes.map(n => n.key));
  const lost = [...overrides.keys()].some(k => G.nodes.some(n => n.key === k) && !keys.has(k));
  return { matched: runOf(m), destructive: m.rUp !== G.rUp || lost };
}
/* 移除紅框不依賴 G —— 配對失敗(G === null)正是最需要移除紅框的時候,
   而 overlay 是照 examples 畫的,不經過 G。 */
function removeExample(ix) {
  if (!(ix >= 0 && ix < examples.length)) return;
  examples.splice(ix, 1);
  if (examples.length < 2) { phase = 'select'; overrides.clear(); redUp = 0; greenUp = 0; }
  moved = false; clearPreview(); rebuild();
}
function onClick(e) {
  if (dlg.open) return;
  if (!on) return;
  /* 紅框 overlay 是 pointer-events:auto,自己就是點擊目標。必須在 UI() 之前特判 ——
     它住在 #gp-overlay 裏,UI() 會把它當成工具自己的介面而放行給頁面。 */
  const t0 = e.target;
  if (t0 && t0.dataset && t0.dataset.gpex !== undefined) {
    e.preventDefault(); e.stopPropagation();
    removeExample(+t0.dataset.gpex);
    return;
  }
  if (!picking() || UI(e.target)) return;
  e.preventDefault(); e.stopPropagation();
  const t = hoverEl; if (!t) return;
  if (examples.some(x => x.origin === t || x.origin.contains(t) || t.contains(x.origin))) {
    toast('與現有樣本重疊,請點平行的元素'); return;
  }
  if (phase === 'add') {
    const probe = tryAdd(t);
    if (!probe) { toast('這個元素無法跟現有樣本組成查詢式'); return; }
    if (probe.destructive && pendingDestructive !== t) {
      pendingDestructive = t;
      toast('會縮短查詢式、部分調校失效 — 再點一次確認');
      return;
    }
    pendingDestructive = null;
    examples.push({ origin: t }); lastPicked = t;
    phase = 'tune'; hoverEl = null; tipEl.style.display = 'none';
    clearPreview(); rebuild(); return;
  }
  examples.push({ origin: t }); lastPicked = t;
  if (examples.length === 2) { phase = 'tune'; hoverEl = null; tipEl.style.display = 'none'; }
  rebuild();
}
const swallow = e => { if (!dlg.open && on && picking() && !UI(e.target)) { e.preventDefault(); e.stopPropagation(); } };
addEventListener('mousemove', onMove, true);
addEventListener('click', onClick, true);
addEventListener('mousedown', swallow, true);
addEventListener('mouseup', swallow, true);
/* 掛在 window capture 階段,會早於 dialog 的 cancel 事件 —— 不擋就會直接把整個工具
   off 掉。Esc 分兩層:modal 開著時第一次只關 modal,第二次才結束工具。 */
addEventListener('keydown', e => { if (e.key === 'Escape' && on && !dlg.open) $('#tool-on').click(); }, true);

/* ═════════ 輸出 ═════════ */
function anchorExpr(target) {
  let e = target; const tail = []; let up = 0;
  while (e && up < 8) {
    if (e.id) {
      const hit = evalIn('//*[@id="' + e.id + '"]', document);
      if (hit && hit.length === 1) return '//*[@id="' + e.id + '"]' + (tail.length ? '/' + tail.join('/') : '');
    }
    for (const c of e.classList) {
      if (!/^[A-Za-z][\w-]*$/.test(c)) continue;
      const x = '//*[contains(concat(" ",normalize-space(@class)," ")," ' + c + ' ")]';
      const hit = evalIn(x, document);
      if (hit && hit.length === 1) return x + (tail.length ? '/' + tail.join('/') : '');
    }
    if (!e.parentElement) break;
    tail.unshift(e.tagName.toLowerCase() + '[' + tagIdx(e) + ']');
    e = e.parentElement; up++;
  }
  return absPath(target);
}
const outputExpr = () => G ? exprOf(G, anchorExpr(G.green)) : null;

function copyText(t, okMsg) {
  const done = () => toast(okMsg);
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(done, () => fallback(t, done));
  else fallback(t, done);
}
function fallback(t, done) {
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
  (dlg.open ? dlg : document.body).appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
  ta.remove();
  ok ? done() : toast('複製失敗');
}

/* ═════════ 2D 擷取:欄位展開(§15) ═════════
   1D 決定「抓哪些東西」,2D 決定「那一列有哪些欄」。藍框集合完全不變,一筆記錄仍然一列。 */
const dlg = $('#gp-dlg');
const ATTRS = ['href', 'src', 'title', 'datetime'];
const COV_N = 50, PV_N = 10;
const CIRC = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮'.split('');
const num = i => i == null ? '' : (CIRC[i] || '(' + (i + 1) + ')');

let can2d = false, fxTree = null, dlgSample = -1, lastPicked = null, showConst = false;
const folded = new Set();          /* 已收合的 blob key,預設全收 */
const checked = new Set(), cuts = new Set();

/* trim() 只剝 WhiteSpace ∪ LineTerminator,不含 Cf 類零寬字元;而 PUA 圖示既非空白
   也看得見,是可能的資料(星號 = 已收藏)。看得見的留下,看不見的剪掉。 */
const blank = v => !String(v).trim().replace(/[\u00AD\u200B-\u200F\u2060-\u2064\uFEFF]/g, '');
/* innerText 對未 render 的元素會 fallback 成 descendant text content,
   <div style="display:none">SECRET</div> 的 innerText 是 "SECRET" —— 偵測不到頭號目標。
   改量 client rects。抓不到 sr-only 是刻意的:三分法下歸錯類只影響排序,不掉資料。 */
const unseen = el => !el.getClientRects().length;
const isHtml = n => n.nodeType === 1 && n.namespaceURI === HTMLNS;
const kids = el => [...el.children].filter(isHtml);
const ownTxt = el => [...el.childNodes].some(n => n.nodeType === 3 && !blank(n.data));
const txtIdx = t => { let i = 1, x = t; while ((x = x.previousSibling)) if (x.nodeType === 3) i++; return i; };

/* 序號一律取真實 DOM 位置,不能用剪枝後的排名,否則選擇式套到其他列會錯位。
   SVG 在 XPath 1.0 裏用標籤名定址不到(命名空間不符),路徑上碰到就放棄這一列。 */
function relXp(node, root, attr) {
  const segs = attr ? ['@' + attr] : [];
  let e = node;
  if (node.nodeType === 3) { segs.unshift('text()[' + txtIdx(node) + ']'); e = node.parentElement; }
  while (e && e !== root) {
    if (!isHtml(e)) return null;
    segs.unshift(e.tagName.toLowerCase() + '[' + tagIdx(e) + ']');
    e = e.parentElement;
  }
  if (e !== root) return null;
  return segs.length ? './' + segs.join('/') : '.';
}

/* 攤平:從 blob 根起 DFS,文件順序吐出「非空白 text node」與「沒有元素子節點的元素」;
   有元素子節點的元素繼續下探,它自己的直屬文字照樣在原位吐出。永遠兩層。
   中間層不長 * —— 同一 blob 內勾選的葉子本來就會併成一欄,它不提供任何新能力。 */
function flatten(el, out, hid) {
  for (const n of el.childNodes) {
    if (n.nodeType === 3) { if (!blank(n.data)) out.push({ node: n, text: norm(n.data) }); continue; }
    if (!isHtml(n)) continue;
    if (unseen(n)) { if (!blank(n.textContent)) hid.push(n); continue; }
    if (kids(n).length) flatten(n, out, hid);
    else if (!blank(n.textContent)) out.push({ node: n, text: norm(n.innerText) });
  }
}

/* 切分規則。不需要坍縮 —— 遞迴只在「有直屬文字」處產出一列,容器天生不出現。
   富文字(<b>/<em> 混在文字裏)算夾層:只看結構不看標籤名,白名單會讓
   <div>from <b>15h ago</b> to</div> 塌成一行,15h ago 就再也挑不出來。 */
function classify(root) {
  const c1 = [], c2 = [], c3 = [], hid = [];
  (function walk(el) {
    if (unseen(el)) { if (!blank(el.textContent)) hid.push(el); return; }
    if (!ownTxt(el)) { kids(el).forEach(walk); return; }
    if (!kids(el).some(k => !blank(k.textContent))) { c1.push(el); return; }
    const leaves = [];
    flatten(el, leaves, hid);
    /* 唯一的葉子被隱藏抽走時降級成第一類 */
    leaves.length >= 2 ? c2.push({ el, leaves }) : c1.push(el);
  })(root);

  /* 第三類 = 屬性 + 隱藏文字,一次文件順序走訪。
     屬性在文字流裏沒有位置,塞進空白 join 只會污染;隱藏文字同理 —— innerText 不含它,
     留在 blob 裏會讓「* 必然含蓋所有葉」這條互斥依據破掉。 */
  const hset = new Set(hid);
  for (const el of [root, ...root.querySelectorAll('*')]) {
    if (!isHtml(el)) continue;
    for (const a of ATTRS) {
      const v = el.getAttribute(a);
      if (v != null && !blank(v)) c3.push({ el, attr: a, text: norm(v) });
    }
    if (hset.has(el)) c3.push({ el, attr: null, text: norm(el.textContent) });
  }

  /* 展示順序:orderby 類別 thenby 文件順序。輸出欄序 = 畫面順序。 */
  const rows = [];
  for (const el of c1) {
    const xp = relXp(el, root);
    if (xp) rows.push({ cat: 1, xp, key: '1|' + xp, text: norm(el.innerText) });
  }
  for (const b of c2) {
    const xp = relXp(b.el, root); if (!xp) continue;
    const leaves = [];
    for (const lf of b.leaves) {
      const lx = relXp(lf.node, root);
      if (lx) leaves.push({ cat: 2, leaf: true, xp: lx, key: '2L|' + lx, text: lf.text });
    }
    if (leaves.length < 2) continue;
    const row = { cat: 2, xp, key: '2|' + xp, text: norm(b.el.innerText), leaves };
    leaves.forEach(l => { l.owner = row; });
    rows.push(row);
  }
  for (const o of c3) {
    const xp = relXp(o.el, root, o.attr);
    if (xp) rows.push({ cat: 3, xp, key: '3|' + xp, text: o.text, attr: o.attr });
  }
  return { rows, count: rows.reduce((a, r) => a + (r.cat === 2 ? r.leaves.length : 1), 0) };
}

/* ── 取值 ──
   0 命中輸出空字串不跳過(TSV 每行 tab 數必須固定);N 命中以空白 join 不取第一個
   (取第一個會靜默丟資料,join 之後那格異常地長,預覽一眼看得出不對)。 */
const nodeVal = n => n.nodeType === 1 ? n.innerText : n.nodeType === 2 ? n.value : n.textContent;
function cellOf(parts, rec) {
  const out = [];
  for (const p of parts) {
    const v = norm((evalIn(p.xp, rec) || []).map(nodeVal).join(' '));
    if (v) out.push(v);
  }
  return out.join(' ');
}

/* coverage 只跑前 50 筆。未取樣時 100 個 leaf × 1000 筆 = 十萬次 evaluate,
   主執行緒會卡死數秒 —— 而那正是這工具最有價值的場合。擷取本身永遠跑全部。
   withVal 時順便比對值是否每一列都一樣(常數欄位)—— 合成同一趟,不多跑一次 evaluate。
   只有第一類與第三類要求值:第二類要讀 innerText,而 blob 的樣板字是它存在的一部分。 */
function covOf(xp, withVal) {
  const S = matched.slice(0, COV_N);
  let ok = 0, multi = false, first = null, same = true;
  for (let i = 0; i < S.length; i++) {
    const ns = evalIn(xp, S[i]) || [];
    if (ns.length) { ok++; if (ns.length > 1) multi = true; }
    if (!withVal) continue;
    const v = norm(ns.map(nodeVal).join(' '));
    if (i === 0) first = v; else if (v !== first) same = false;
  }
  return { ok, tot: S.length, multi, konst: !!withVal && S.length >= 2 && same };
}

const sampleIx = () => {
  const i = examples.findIndex(x => x.origin === lastPicked);
  return i >= 0 ? i : examples.length - 1;
};

/* 欄 = 一個列群組:第一類項、第二類 blob、第三類項。
   切點旗標的前綴和推導欄號 —— 任何操作序列都不可能產生非法狀態,不需要驗證邏輯。 */
function colsOf() {
  const cols = [];
  if (!fxTree) return cols;
  for (const r of fxTree.rows) {
    if (r.cat !== 2) { if (checked.has(r.key)) cols.push([r]); continue; }
    if (checked.has(r.key)) { cols.push([r]); continue; }
    let cur = null;
    for (const lf of r.leaves) {
      if (!checked.has(lf.key)) continue;
      if (!cur || cuts.has(lf.key)) { cur = []; cols.push(cur); }
      cur.push(lf);
    }
  }
  return cols;
}

/* ── 繪製 ── */
function bdgEl(c) {
  return el('bdg' + (c.ok < c.tot ? ' part' : c.multi ? ' multi' : ''),
            c.ok + '/' + c.tot + (c.multi ? '⚠' : ''));
}
function rowEl2(r, colNo, dis, cut) {
  const d = el('frow' + (dis ? ' dis' : ''));
  if (cut) d.appendChild(cut);
  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.checked = checked.has(r.key); cb.disabled = dis;
  cb.addEventListener('change', () => toggle2d(r));
  d.appendChild(cb);
  if (r.attr) d.appendChild(el('ak', r.attr));
  /* 原本 * 只是個裝飾標記,換成這一區的收合鈕 —— 位置本來就對,而三角形同時
     告訴你「這是一群」跟「現在收著還是開著」,比 * 多說一件事。 */
  if (r.cat === 2 && !r.leaf) {
    const f = folded.has(r.key);
    const tw = el('star fold', f ? '›' : '⌄');
    tw.title = f ? '展開這一區' : '收合這一區';
    tw.addEventListener('click', e => {
      e.stopPropagation();
      f ? folded.delete(r.key) : folded.add(r.key);
      renderDlg();
    });
    d.appendChild(tw);
  }
  d.appendChild(el('ft' + (r.text ? '' : ' empty'), r.text ? clip(r.text, 90) : '(空)'));
  d.appendChild(el('cn', num(colNo)));
  d.appendChild(bdgEl(r.cov));
  return d;
}
function toggle2d(r) {
  if (checked.has(r.key)) { checked.delete(r.key); cuts.delete(r.key); }
  else {
    checked.add(r.key);
    /* 互斥只在單一 blob 內部:* 的 innerText 必然含蓋所有葉,並存必然重複。
       雙向 disable 由 renderDlg 施加,葉子那一側因此不需要在這裏清理 —— 勾得動葉子
       就代表 * 沒被勾。這裏只處理反向:勾 * 時把先前勾過的葉子連同切點一起收掉。 */
    if (r.cat === 2 && !r.leaf) r.leaves.forEach(l => { checked.delete(l.key); cuts.delete(l.key); });
  }
  renderDlg();
}
function cutEl(r, lf) {
  const chk = checked.has(lf.key);
  if (!chk) return el('cut off', '┃');
  const first = r.leaves.find(l => checked.has(l.key)) === lf;
  if (first) { const c = el('cut lock', '┃'); c.title = '第一欄的起點,固定'; return c; }
  const on = cuts.has(lf.key);
  const c = el('cut' + (on ? '' : ' soft'), on ? '┃' : '┆');
  c.title = on ? '併回前一欄' : '從這裏開新欄';
  c.addEventListener('click', () => { on ? cuts.delete(lf.key) : cuts.add(lf.key); renderDlg(); });
  return c;
}

function renderDlg() {
  const host = $('#gp-dtree'); host.replaceChildren();
  $('#gp-dtitle').textContent = '共 ' + matched.length + ' 筆';
  const samp = $('#gp-dsamp'); samp.replaceChildren();
  examples.forEach((_, i) => {
    const b = document.createElement('button');
    b.className = 'samp' + (i === dlgSample ? ' on' : '');
    b.textContent = '紅' + (i + 1);
    b.title = '換成這一列當樣本 — 樹會重建,勾選清空';
    b.addEventListener('click', () => { if (i !== dlgSample) { dlgSample = i; buildTree(); renderDlg(); } });
    samp.appendChild(b);
  });
  if (!fxTree) return;

  if (matched.length > COV_N)
    host.appendChild(el('dnote', '診斷以前 ' + COV_N + ' 筆取樣(共 ' + matched.length + ' 筆);擷取仍為全部'));

  /* 每一列都長一樣 = 樣板字不是資料。自動移除,但留一條可展開的記錄 ——
     變化只出現在取樣 50 筆之後的欄位會被誤殺,而靜默隱藏資料是最糟的失敗方向。
     已勾選的常數列一律不藏:收起來會變成看不見卻仍在輸出裏的一欄。 */
  const isHid = r => r.cov.konst && !showConst && !checked.has(r.key);
  const nHid = fxTree.rows.filter(isHid).length;
  if (nHid || showConst) {
    const n = el('dnote hid', showConst ? '⌄ 收起所有列都相同的內容'
                                       : '› 已隱藏 ' + nHid + ' 項所有列都相同的內容');
    n.addEventListener('click', () => { showConst = !showConst; renderDlg(); });
    host.appendChild(n);
  }

  const cols = colsOf(), cn = new Map();
  cols.forEach((parts, i) => parts.forEach(p => cn.set(p.key, i)));

  const NAMES = { 1: '第一類 (看得到的簡單欄位)', 2: '第二類 (看得到的複雜文字)', 3: '第三類 (看不到的欄位)' };
  let first = true;
  for (const cat of [1, 2, 3]) {
    const rs = fxTree.rows.filter(r => r.cat === cat && !isHid(r));
    if (!rs.length) continue;
    const sec = el('sect' + (first ? ' first' : '')); first = false;
    if (cat === 2) {
      /* 全展開／全收合。狀態由「是不是每一區都收著」推導,不另存一個開關 —— 
         兩個真相來源會在使用者單獨開合某一區之後對不起來。 */
      const allF = rs.every(r => folded.has(r.key));
      const t = el('secfold', allF ? '›' : '⌄');
      t.title = allF ? '全部展開' : '全部收合';
      t.addEventListener('click', () => {
        rs.forEach(r => allF ? folded.delete(r.key) : folded.add(r.key));
        renderDlg();
      });
      sec.appendChild(t);
    }
    sec.appendChild(el('secname', NAMES[cat]));
    host.appendChild(sec);
    for (const r of rs) {
      if (cat !== 2) {
        const d = rowEl2(r, cn.get(r.key), false);
        if (r.cov.konst) { d.classList.add('konst'); d.title = '所有列的內容都相同'; }
        host.appendChild(d); continue;
      }
      const anyLeaf = r.leaves.some(l => checked.has(l.key));
      const d = rowEl2(r, cn.get(r.key), anyLeaf);
      if (folded.has(r.key)) {
        /* 收著的時候把葉子貢獻的欄號提到這一列 —— 否則會出現「看不見卻在輸出裏」的欄。
           .cn 用 min-width 所以多幾個號碼是壓縮 .ft,徽章那一欄仍然對齊。 */
        const ns = r.leaves.filter(l => checked.has(l.key)).map(l => num(cn.get(l.key))).join('');
        if (ns) d.querySelector('.cn').textContent = ns;
        host.appendChild(d); continue;
      }
      host.appendChild(d);
      const rootOn = checked.has(r.key);
      r.leaves.forEach(lf => host.appendChild(rowEl2(lf, cn.get(lf.key), rootOn, cutEl(r, lf))));
    }
  }

  /* 徽章說「這條路徑在幾列上成立」,預覽表說「抓到的內容對不對」—— 不可互相取代 */
  const pv = $('#gp-dprev'); pv.replaceChildren();
  if (!cols.length) pv.appendChild(el('pvempty', '勾選欄位以預覽'));
  else {
    const t = document.createElement('table'); t.className = 'pv';
    matched.slice(0, PV_N).forEach(rec => {
      const tr = document.createElement('tr');
      cols.forEach(parts => {
        const td = document.createElement('td');
        td.textContent = cellOf(parts, rec);
        tr.appendChild(td);
      });
      t.appendChild(tr);
    });
    pv.appendChild(t);
    if (matched.length > PV_N) pv.appendChild(el('dnote', '⋯ 還有 ' + (matched.length - PV_N) + ' 筆'));
  }
  $('#btn-2dcopy').disabled = !cols.length;
  $('#btn-2dcopy').textContent = cols.length ? '複製 ' + matched.length + ' 筆 · ' + cols.length + ' 欄' : '複製';
}

/* 樹只從一個樣本紅框長出。不做跨列聯集 —— 聯集出來的樹不對應畫面上任何一個實際元素。
   切換樣本 = 重建 + 清空勾選,不嘗試用路徑字串把舊勾選比對回新樹:換了樣本意味著結構
   可能完全不同,勉強對回去只會產生看似成功實則錯位的選擇。 */
function buildTree() {
  checked.clear(); cuts.clear();
  fxTree = G ? classify(G.reds[dlgSample]) : null;
  if (!fxTree) return;
  showConst = false; folded.clear();
  fxTree.rows.forEach(r => { if (r.cat === 2) folded.add(r.key); });   /* 預設全收合 */
  for (const r of fxTree.rows) {
    r.cov = covOf(r.xp, r.cat !== 2);
    if (r.cat === 2) r.leaves.forEach(l => { l.cov = covOf(l.xp); });
  }
}

$('#btn-2d').addEventListener('click', () => {
  if (!can2d) return;
  dlgSample = sampleIx();
  buildTree();
  dlg.showModal();
  renderDlg();
});
$('#btn-dclose').addEventListener('click', () => dlg.close());
/* 欄位定義只活在 modal 開啟期間。換來的是整條失效規則消失 —— 不需要 sampleEl 身分比對、
   不需要「樣本已變更」的提示。唯一的重建時機是 modal 內切換樣本。 */
dlg.addEventListener('close', () => { fxTree = null; checked.clear(); cuts.clear(); });
$('#btn-2dcopy').addEventListener('click', () => {
  const cols = colsOf();
  if (!cols.length) return;
  copyText(matched.map(rec => cols.map(p => cellOf(p, rec)).join('\t')).join('\n'),
           '已複製 ' + matched.length + ' 筆 · ' + cols.length + ' 欄');
});

/* ═════════ 沙盒 chrome ═════════ */
const FIXTURES = ['clean','google','stretch','deco','union','card'];
/* 案例1 與 案例1-2 練的是同一組功能,共用同一份說明 */
const GUIDES = { clean:'anc', google:'anc', stretch:'stretch', deco:'deco', union:'union', card:'card' };
function loadFixture(which) {
  if (!FIXTURES.includes(which)) which = 'clean';
  const sel = $('#fixture');
  if (sel.value !== which) sel.value = which;
  $('#fx').replaceChildren(document.getElementById('fx-' + which).content.cloneNode(true));
  $('#guide-body').replaceChildren(document.getElementById('gd-' + GUIDES[which]).content.cloneNode(true));
  $('#guide-name').textContent = sel.selectedOptions[0].textContent;
  resetAll();
}
$('#fixture').addEventListener('change', e => loadFixture(e.target.value));
$('#tool-on').addEventListener('change', e => {
  on = e.target.checked; panel.classList.toggle('on', on); resetAll();
});
$('#guide-fold').addEventListener('click', e => {
  e.target.textContent = $('#guide').classList.toggle('min') ? '展開' : '收合';
});
$('#btn-abstract').addEventListener('click', () => { abstract = !abstract; render(); });
$('#btn-txtmode').addEventListener('click', () => { txtMode = (txtMode + 1) % TXTMODES.length; render(); });
$('#btn-min').addEventListener('click', () => panel.classList.toggle('min'));
$('#btn-copy').addEventListener('click', () => {
  const x = outputExpr();
  x ? copyText(x, '已複製:' + clip(x, 60)) : toast('沒有可複製的查詢式');
});
$('#btn-extract').addEventListener('click', () =>
  copyText(matched.map(getTxt).join('\n'), '已複製 ' + matched.length + ' 筆'));

(() => {
  const head = panel.querySelector('.head');
  let sx = 0, sy = 0, ox = 0, oy = 0, drag = false;
  head.addEventListener('mousedown', e => {
    if (e.target.tagName === 'BUTTON') return;
    const r = panel.getBoundingClientRect();
    panel.style.left = r.left + 'px'; panel.style.top = r.top + 'px';
    panel.style.right = 'auto'; panel.style.bottom = 'auto';
    sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top; drag = true;
    e.preventDefault(); e.stopPropagation();
  }, true);
  addEventListener('mousemove', e => {
    if (!drag) return;
    panel.style.left = Math.max(4, ox + e.clientX - sx) + 'px';
    panel.style.top = Math.max(4, oy + e.clientY - sy) + 'px';
  }, true);
  addEventListener('mouseup', () => { drag = false; }, true);
})();

loadFixture('clean');
})();
</script>
</body>
