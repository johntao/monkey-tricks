<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>通用擷取 v3 — 沙盒</title>
<style>
:root{
  --bg:#fff; --fg:#1c2430; --mute:#5b6672; --faint:#9aa3ad;
  --line:#d7dce2; --panel:#f2f4f6; --btn:#e3e7ec;
  --red:#c8102e; --green:#0a8f3c; --blue:#0a66c2; --orange:#e8590c;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
     color:var(--fg);background:var(--bg);line-height:1.6}

/* ---------- 沙盒 chrome ---------- */
header.sandbox{position:sticky;top:0;z-index:100;display:flex;gap:18px;align-items:center;
  padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);font-size:14px}
header.sandbox .sp{flex:1}
header.sandbox label{display:flex;gap:8px;align-items:center;cursor:pointer;user-select:none}
.switch{position:relative;display:inline-block;width:2.6rem;height:1.3rem;flex:0 0 auto}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .track{position:absolute;inset:0;background:#c3cad2;border-radius:1rem;transition:background .18s}
.switch .thumb{position:absolute;top:2px;left:2px;width:calc(1.3rem - 4px);height:calc(1.3rem - 4px);
  background:#fff;border-radius:50%;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked + .track{background:var(--green)}
.switch input:checked + .track .thumb{transform:translateX(1.3rem)}
select{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:#fff}
.hint{color:var(--mute);font-size:13px}

main{padding:24px 18px 60vh;max-width:820px}

/* ---------- 乾淨 fixture ---------- */
.panel-box{max-width:720px;border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.panel-box h2{margin:0 0 2px;font-size:1.05rem}
.panel-note{color:var(--mute);font-size:13px;margin-bottom:12px}
.grid{display:flex;gap:28px}
.col{list-style:none;margin:0;padding:0;flex:1}
.item{margin:0 0 6px}
.card{border:1px solid var(--line);border-radius:8px}
.link{display:block;padding:8px 12px;text-decoration:none;color:var(--fg)}
.link:hover{background:var(--panel)}

/* ---------- google fixture 讓它有形狀 ---------- */
#fx .EIaa9b{display:flex;gap:20px}
#fx .M6HR1c{font-weight:700;margin-bottom:10px}
#fx .AJLUJb{flex:1}
#fx .b2Rnsc{margin-bottom:6px}
#fx .ngTNl{display:block;padding:8px 12px;border:1px solid var(--line);border-radius:8px;
  text-decoration:none;color:var(--fg)}
#fx .B2VR9{display:flex;align-items:center;gap:8px}
#fx .wyccme{flex:1}
#fx .mgAbYb{font-weight:700;font-size:1.05rem}
#fx svg{width:16px;height:16px;fill:var(--mute)}

/* ---------- 案例二:鋪滿整列的連結 ---------- */
table.rows{border-collapse:collapse;width:100%;max-width:640px}
table.rows th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;
  padding:6px 10px;border-bottom:1px solid var(--line)}
table.rows tr.row{position:relative}
table.rows td{padding:9px 10px;border-bottom:1px solid var(--line)}
table.rows tr.row:hover{background:var(--panel)}
a.stretch{position:absolute;inset:0;display:block}

/* ---------- 案例一:裝飾層 ---------- */
.demo{margin-bottom:26px}
.demo > h2{font-size:.95rem;margin:0 0 8px;color:var(--mute);font-weight:600}
.list{list-style:none;margin:0;padding:0;max-width:420px}
.list .item{margin-bottom:6px}
.list .t{display:block;padding:8px 12px;border:1px solid var(--line);border-radius:8px;
  text-decoration:none;color:var(--fg)}
.list .promo{border-left:3px solid #e8590c;padding-left:6px}
.list .badge{border-left:3px solid #0a66c2;padding-left:6px}
.feed{max-width:420px}
.feed .post{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:6px}
.feed .post h3{margin:0;font-size:.95rem}
.feed .post .meta{margin:2px 0 0;font-size:12px;color:var(--mute)}
.feed .promo{border-left:3px solid #e8590c;padding-left:6px;margin-bottom:6px}
.feed .ad{border:1px dashed var(--line);border-radius:8px;padding:8px 12px;
  font-size:12px;color:var(--mute)}


/* ---------- 工具 overlay ----------
   綠 = 完全在外;藍 = 騎在邊框上;紅 = 內填色(不畫線)。三種不同編碼,不是三個同心環。 */
#gp-overlay{position:fixed;inset:0;pointer-events:none;z-index:2147483000}
#gp-overlay .bx{position:fixed;pointer-events:none}
.bx.hover{border:2px dashed var(--orange);background:rgba(232,89,12,.07)}
.bx.green{border:2px solid var(--green)}
.bx.blue{border:2px solid var(--blue)}
/* 畫布只畫一個狀態:有預覽時藍框就是預覽後的集合,實線直接搬過去。
   虛線增刪那套視覺語言認知負荷太高,不做預設。 */
.bx.red{background:rgba(200,16,46,.12)}
#gp-tip{position:fixed;z-index:2147483100;pointer-events:none;display:none;
  font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:4px;
  background:#1c2430;color:#fff;white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis}

/* ---------- 面板 ---------- */
#gp-panel{position:fixed;right:16px;bottom:16px;z-index:2147483200;display:none;
  width:min(880px,64vw);max-height:70vh;background:var(--bg);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.22);font-size:13px;
  flex-direction:column;overflow:hidden}
#gp-panel.on{display:flex}
#gp-panel .head{display:flex;gap:10px;align-items:center;padding:7px 12px;cursor:move;
  background:var(--panel);border-bottom:1px solid var(--line);user-select:none}
#gp-panel .head .sp{flex:1}
#gp-panel .body{flex:1 1 auto;overflow:auto;padding:0}
#gp-panel .foot{flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel);
  padding:7px 12px;display:flex;gap:10px;align-items:center}
#gp-panel .foot .sp{flex:1}
#gp-panel.min .body,#gp-panel.min .foot{display:none}
button.gp{font:inherit;font-size:12px;line-height:1;padding:5px 9px;border:1px solid var(--line);
  border-radius:5px;background:var(--btn);color:var(--fg);cursor:pointer}
button.gp:hover:not(:disabled){background:#d5dbe2}
button.gp:disabled{opacity:.45;cursor:default}

/* ---------- 第 1 列:查詢式 pills ----------
   括號內 = 查詢式,兩側(綠框以上、紅框以下)灰掉。不做坍縮 ——
   坍縮會在按下拖曳的瞬間展開、把落點從游標底下推走,改用橫向捲軸。 */
#gp-rowwrap{overflow-x:auto;overflow-y:hidden;padding:12px 12px 10px;border-bottom:1px solid var(--line)}
#gp-rowwrap::-webkit-scrollbar{height:7px}
#gp-rowwrap::-webkit-scrollbar-thumb{background:#c9d0d8;border-radius:4px}
#gp-row{display:flex;align-items:center;gap:3px;white-space:nowrap;min-height:30px;
  width:max-content;padding-top:16px}
.pill{display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:12px;
  padding:3px 6px;border-radius:5px;background:#eef1f4;color:var(--fg);position:relative}
.pill.dim{background:transparent;color:var(--faint)}
.pill.lock{color:var(--mute)}
.pill.isgreen{color:var(--green);font-weight:700}
.pill .tag{pointer-events:none}
/* 序號片:實心 = 查詢式裏真的有 [n];空心 = 真的沒有。畫面即查詢式,不需要翻譯。 */
.pill .ix{margin-left:1px;padding:0 3px;border-radius:3px;cursor:pointer;
  border:1px solid var(--blue);color:var(--blue);background:transparent;opacity:.55}
.pill .ix.on{background:var(--blue);color:#fff;opacity:1}
.pill .ix:hover{opacity:1;box-shadow:0 0 0 2px rgba(10,102,194,.22)}

/* 抽象化:整顆 pill 就是開關。灰 = 不能按;實心 = 序號開著;空心 = 序號關著。
   沒有開關的 pill 一律沒有 hover 效果 —— 會亮的東西必須是能按的東西。 */
.pill.abs{min-width:22px;height:17px;padding:0 4px;border-radius:4px}
.pill.abs.lock{background:#dde2e8}
.pill.abs.dim{background:transparent;border:1px dashed #ccd3da}
.pill.abs.isgreen{border-color:var(--green);border-style:solid}
.pill.abs.on{background:var(--blue);cursor:pointer}
.pill.abs.off{background:var(--bg);border:2px solid var(--blue);cursor:pointer}
.pill.abs.on:hover,.pill.abs.off:hover{box-shadow:0 0 0 3px rgba(10,102,194,.22)}


/* ▼ = 現在(可拖);▽ = 原始位置。標記指著「哪一顆 pill」而不是縫隙 ——
   縫隙上的直立拉桿會讓人分不清它屬於左邊還是右邊那一層。
   紅綠都只能往左離開原始位置,所以 ▽ 永遠在 ▼ 的右邊。 */
.mk {position: absolute;left: 50%;transform: translateX(-50%);top: -16px;font-size: 11px;
  line-height: 1.6;pointer-events: none;user-select: none;width: 100%;text-align: center;height: 100%}
.mk.g{color:var(--green)}
.mk.r{color:var(--red)}
.mk.ghost{opacity:.5}
.mk.cur{pointer-events:auto;cursor:ew-resize}

/* 分岔:同一列局部裂成兩線再合回來(捷運路線圖),不需要符號或圖例。
   分歧槽即使沒有分岔也存在 —— ＋ 必須永遠在,否則沒有分岔時就長不出第一條岔路。 */
.fork{display:inline-flex;flex-direction:column;gap:3px;
  border-left:2px solid var(--faint);border-right:2px solid var(--faint);
  border-radius:6px;padding:3px 5px;margin:0 2px}
.fork.bare{border-color:transparent;padding:3px 1px}
.branch{display:inline-flex;align-items:center;gap:3px}
.branch .empty{font-size:11px;color:var(--faint);font-family:var(--mono)}
/* 刪除而不是停用:停用會讓範例掉到 1 個,破壞「至少選兩個」的規則 */
.btrash{font-size:11px;line-height:1;padding:1px 3px;border-radius:4px;cursor:pointer;
  opacity:.5;filter:grayscale(1)}
.btrash:hover{opacity:1;filter:none;background:rgba(200,16,46,.12)}
.btrash.dead{opacity:.18;cursor:default}
.bplus{align-self:center;font-size:11px;line-height:1;color:var(--mute);cursor:pointer;
  border:1px dashed var(--line);border-radius:4px;padding:1px 7px;margin-top:1px;background:var(--bg)}
.bplus:hover{color:var(--blue);border-color:var(--blue)}
.bplus.armed{color:#fff;background:var(--blue);border-color:var(--blue);border-style:solid}

/* ---------- 預覽列表 = 差異檢視器 ----------
   消失的列位置保留不重排,否則整份列表會跳動、眼睛得重找位置。 */
#gp-list{padding:6px 12px 10px}
.lrow{display:flex;gap:7px;align-items:baseline;padding:2px 4px;border-radius:4px}
.lrow .aim{font-size:11px;color:var(--faint);cursor:pointer;flex:0 0 auto;line-height:1.4}
.lrow .aim:hover{color:var(--blue)}
.lrow .li{font-family:var(--mono);font-size:11px;color:var(--faint);width:1.6em;text-align:right;flex:0 0 auto}
.lrow .lt{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .lt.empty{color:var(--red);font-style:italic}
.lrow.ex{background:rgba(200,16,46,.07)}
.lrow.add{background:rgba(10,102,194,.13)}
.lrow.drop{opacity:.4}
.lrow.drop .lt{text-decoration:line-through}
.lmore{display:block;font-size:11px;color:var(--faint);padding:3px 4px}

#gp-count{white-space:nowrap;font-weight:700;color:var(--blue)}
#gp-count.pv{color:var(--orange)}
#gp-msg{color:var(--orange);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>

    <span>擷取模式</span>

<script>
(() => {
'use strict';

/* ═════════ 小工具 ═════════ */
const $ = s => document.querySelector(s);
const UI = el => !!(el && el.closest && el.closest('#gp-panel,#gp-overlay,#gp-tip,header.sandbox'));
const norm = s => String(s).replace(/\s+/g, ' ').trim();
const clip = (s, n) => { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const HTMLNS = 'http://www.w3.org/1999/xhtml';

const TXTMODES = [
  { label:'文字', tip:'innerText:所見即所得', get: el => el.innerText },
  { label:'直屬', tip:'只取直屬文字節點,不展開巢狀',
    get: el => [...el.childNodes].filter(n => n.nodeType === 3).map(n => n.data).join('') },
  { label:'標記', tip:'innerHTML:連標籤一起輸出', get: el => el.innerHTML }
];
let txtMode = 0;
const getTxt = el => norm(TXTMODES[txtMode].get(el));

const tagIdx = el => { let i = 1, s = el; while ((s = s.previousElementSibling)) if (s.tagName === el.tagName) i++; return i; };
const ancAt = (el, n) => { let e = el; while (n-- > 0 && e) e = e.parentElement; return e; };
const segsUp = (el, anc) => {
  const a = []; let e = el;
  while (e && e !== anc) { a.unshift({ tag: e.tagName.toLowerCase(), idx: tagIdx(e), el: e }); e = e.parentElement; }
  return a;
};
const absPath = el => '/' + segsUp(el, null).map(s => s.tag + '[' + s.idx + ']').join('/');
const label = el => el.tagName.toLowerCase() + (el.id ? '#' + el.id : '')
  + (el.classList.length ? '.' + [...el.classList].slice(0, 2).join('.') : '');
const ncaOf = els => {
  let a = els[0].parentElement;
  while (a && !els.every(e => a.contains(e) && a !== e)) a = a.parentElement;
  return a;
};
const docOrder = (a, b) => (a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING) ? -1 : 1;

/* 沒有自己的直屬文字 = 這顆是「容器」而不是「欄位」。
   不看子元素數量 —— <span>Unit test <b>是什麼</b></span> 有子元素卻是文字欄位。 */
const noOwnText = el => {
  for (const n of el.childNodes) if (n.nodeType === 3 && n.data.trim()) return false;
  return true;
};

/* SVG 元素在 XPath 1.0 裏用標籤名定址不到(命名空間不符,`./span/svg` 回 0 筆),
   所以選取一律夾到包住它的那個 HTML 元素。 */
function pickable(t) {
  if (!t || !t.closest) return null;
  let s = t.closest('svg');
  while (s) { const up = s.parentElement && s.parentElement.closest ? s.parentElement.closest('svg') : null;
              if (up) s = up; else break; }
  if (s) t = s.parentElement;
  if (!t || t.namespaceURI !== HTMLNS) return null;
  return t;
}

/* ═════════ 狀態 ═════════ */
let on = false, phase = 'idle';          /* idle | select | tune | add */
let examples = [];                       /* {origin} */
let redUp = 0, greenUp = 0;
let overrides = new Map();               /* node.key → 'idx' | 'bare' */
let abstract = true;
let G = null, matched = [], preview = null;
let hoverEl = null, dragging = null, pendingDestructive = null;
let moved = true;                        /* 游標自上次點擊後是否移動過 */
let toastMsg = '';

const LIST_N = 12;

/* ═════════ 幾何 ═════════ */
function validStops(origins) {
  const out = [];
  for (let r = 0; ; r++) {
    const els = origins.map(o => ancAt(o, r));
    if (els.some(e => !e || e === document.body || e === document.documentElement)) break;
    let bad = false;
    for (let i = 0; i < els.length && !bad; i++)
      for (let j = 0; j < els.length; j++)
        if (i !== j && (els[i] === els[j] || els[i].contains(els[j]))) { bad = true; break; }
    if (bad) break;
    if (!ncaOf(els)) break;
    if (els.every(e => e.tagName === els[0].tagName)) out.push(r);
  }
  return out;
}
function greenStrip(nca) {
  const out = []; let e = nca, k = 0;
  while (e) { out.unshift({ el: e, k }); if (e === document.documentElement) break; e = e.parentElement; k++; }
  return out;
}

function computeGeom(gUp, rUp, exs) {
  exs = exs || examples;
  if (exs.length < 2) return null;
  const origins = exs.map(e => e.origin);
  const stops = validStops(origins);
  if (!stops.length) return null;
  const r = stops.includes(rUp) ? rUp : (stops.filter(s => s <= rUp).pop() ?? stops[0]);
  const reds = origins.map(o => ancAt(o, r));
  const nca = ncaOf(reds);
  if (!nca) return null;

  const strip = greenStrip(nca);
  const maxG = strip.length - 1;
  const g = Math.min(Math.max(gUp, 0), maxG);
  const green = strip[maxG - g].el;

  const paths = reds.map(rd => segsUp(rd, nca));
  paths.forEach(p => p.forEach((s, i) => { s.r = r + (p.length - 1 - i); }));

  /* 共同結尾:從尾端逐層比對「標籤」。序號相異不影響 —— 那一層改用 forced bare。 */
  let L = 0;
  const minLen = Math.min(...paths.map(p => p.length));
  while (L < minLen) {
    const t = paths[0][paths[0].length - 1 - L].tag;
    if (paths.every(p => p[p.length - 1 - L].tag === t)) L++; else break;
  }

  const prefixes = paths.map(p => p.slice(0, p.length - L));
  const fork = prefixes.some(p => p.length > 0);

  /* 分支的身分是「形狀」(標籤序列)而不是 tag+idx,否則 li[1] 與 li[3] 會變成
     兩條畫起來一模一樣的冗餘分支。序號相異時該層自然 forced bare。 */
  const bmap = new Map();
  prefixes.forEach((p, i) => {
    const sig = p.map(s => s.tag).join('/');
    if (!bmap.has(sig)) bmap.set(sig, { sig, cols: p.map(s => [s]), exs: [] });
    else p.forEach((s, k) => bmap.get(sig).cols[k].push(s));
    bmap.get(sig).exs.push(i);
  });
  const branches = [...bmap.values()];

  const chain = segsUp(nca, green);
  chain.forEach((s, i) => { s.k = chain.length - 1 - i; });

  const geom = { reds, nca, green, gUp: g, rUp: r, stops, strip, paths, L, branches, chain, fork, exs };
  buildNodes(geom);
  return geom;
}

/* ═════════ pill 節點 ═════════ */
function buildNodes(geom) {
  const nodes = [];
  const mk = n => { nodes.push(n); return n; };
  geom.chainNodes = geom.chain.map(s =>
    mk({ kind:'chain', tag:s.tag, idxs:[s.idx], els:[s.el], key:s.el, k:s.k }));
  geom.branches.forEach((b, bi) => {
    b.nodes = b.cols.map(col => mk({ kind:'prefix', tag:col[0].tag, idxs:col.map(s => s.idx),
      els:col.map(s => s.el), key:'B' + b.sig + '@' + col[0].r, r:col[0].r, branch:bi }));
  });
  geom.sufNodes = [];
  for (let j = geom.L - 1; j >= 0; j--) {
    const segs = geom.paths.map(p => p[p.length - 1 - j]);
    geom.sufNodes.push(mk({ kind:'suffix', tag:segs[0].tag, idxs:segs.map(s => s.idx),
      els:segs.map(s => s.el), key:'S@' + (geom.rUp + j), r: geom.rUp + j }));
  }
  geom.nodes = nodes;
  geom.terminal = geom.sufNodes[geom.sufNodes.length - 1] || null;

  for (const n of nodes) {
    n.forced = n.idxs.some(i => i !== n.idxs[0]);
    /* 終端是「欄位」還是「一筆記錄」:有直屬文字 = 欄位,保留使用者點的序號;
       沒有直屬文字 = 容器,丟掉序號才會每一筆都抓到。量詞取 any —— idx 是比較緊
       的一邊,猜錯的後果是漏抓(看得見)。 */
    const field = n === geom.terminal && n.els.some(e => !noOwnText(e));
    n.def = (field && !n.forced) ? 'idx' : 'bare';
    n.state = n.forced ? 'bare' : n.def;
    if (!n.forced && overrides.has(n.key)) n.state = overrides.get(n.key);
  }
}

const segStr = n => n.tag + (n.state === 'idx' ? '[' + n.idxs[0] + ']' : '');

function exprOf(geom, root) {
  root = root || '.';
  if (!geom) return null;
  const c = geom.chainNodes.map(segStr).join('/');
  const suf = geom.sufNodes.map(segStr).join('/');
  const head = root + (c ? '/' + c : '');
  const tail = suf ? '/' + suf : '';
  if (!geom.fork) return head + tail;
  const bs = geom.branches.map(b => {
    const p = b.nodes.map(segStr).join('/');
    return head + (p ? '/' + p : '');
  });
  if (bs.length === 1) return bs[0] + tail;
  return '(' + bs.join(' | ') + ')' + tail;
}

function evalIn(expr, root) {
  if (!expr || !root) return null;
  try {
    const it = document.evaluate(expr, root, null, XPathResult.ORDERED_NODE_SNAPSHOT_TYPE, null);
    const out = [];
    for (let i = 0; i < it.snapshotLength; i++) out.push(it.snapshotItem(i));
    return out;
  } catch (e) { return null; }
}
const runOf = geom => evalIn(exprOf(geom), geom && geom.green) || [];

/* ═════════ 鎖定判定 ═════════
   把其他所有開關設成 bare,在那個基準下比較這一顆的開與關。相同 ⇒ 永久無關。
   純 child 軸下每個候選的祖先鏈唯一,Result = C ∩ ⋂ⱼPⱼ,各層條件獨立相交;
   其他全 bare 時 ⋂_{j≠k}Pⱼ = 全集,量到的正是 C ⊆ P_k —— sound 且 complete。 */
function analyze(geom) {
  const save = geom.nodes.map(n => n.state);
  const cnt = () => runOf(geom).length;

  geom.nodes.forEach(n => { if (!n.forced) n.state = 'bare'; });
  for (const n of geom.nodes) {
    if (n.forced) { n.permaLock = true; continue; }
    n.state = 'idx'; const a = cnt();
    n.state = 'bare'; const b = cnt();
    n.permaLock = (a === b);
  }
  geom.nodes.forEach((n, i) => { n.state = n.permaLock ? 'bare' : save[i]; });
  geom.nodes.forEach(n => { if (n.permaLock) overrides.delete(n.key); });

  for (const n of geom.nodes) {
    if (n.permaLock) { n.visible = false; continue; }
    const s = n.state;
    n.state = 'idx'; const a = cnt();
    n.state = 'bare'; const b = cnt();
    n.state = s;

  }

/* ═════════ 試算 ═════════ */
function matchesIfBound(gUp, rUp) {
  const m = computeGeom(gUp, rUp);
  return m ? runOf(m) : [];
}
function matchesWithout(bi) {
  const drop = new Set(G.branches[bi].exs);
  const rest = examples.filter((_, i) => !drop.has(i));
  if (rest.length < 2) return null;
  const m = computeGeom(greenUp, redUp, rest);
  return m ? runOf(m) : [];
}

/* ═════════ overlay ═════════ */
const ov = $('#gp-overlay'), tipEl = $('#gp-tip');
let boxes = [];
function paintBoxes() {
  const f = document.createDocumentFragment();
  for (const b of boxes) {
    const r = b.el.getBoundingClientRect();
    const p = b.pad || 0;
    const d = document.createElement('div');
    d.className = 'bx ' + b.kind;
    d.style.left = (r.left - p) + 'px'; d.style.top = (r.top - p) + 'px';
    d.style.width = Math.max(0, r.width + p * 2) + 'px';
    d.style.height = Math.max(0, r.height + p * 2) + 'px';
    f.appendChild(d);

}
/* 畫布永遠只畫「一個狀態」,從不畫兩個狀態的差 ——
   有預覽時藍框就是預覽後的集合(實線,直接搬過去),增刪的差只活在下方列表。
   虛線增刪那套視覺語言認知負荷太高,不該是預設。 */

  boxes = [];
  if (hoverEl) boxes.push({ el: hoverEl, kind: 'hover', pad: 0 });
  if (G && G.green) boxes.push({ el: G.green, kind: 'green', pad: 3 });
  for (const el of (preview || matched)) boxes.push({ el, kind: 'blue', pad: 1 });
  const reds = G ? G.reds : examples.map(x => x.origin);
  reds.forEach(rd => { if (rd) boxes.push({ el: rd, kind: 'red', pad: 0 }); });
  paintBoxes();
}
let raf = 0;
const schedule = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; paintBoxes(); }); };
addEventListener('scroll', schedule, true);
addEventListener('resize', schedule);

function setPreview(next) { preview = next || []; rebuildBoxes(); renderCount(); renderList(); }
function clearPreview() { if (!preview) return; preview = null; rebuildBoxes(); renderCount(); renderList(); }

   若不擋,使用者會立刻看到一次「反向預覽」。必須先移開再回來才算數。 */
const armed = () => moved;

/* ═════════ 面板 ═════════ */

function renderRow() {
  rowEl.replaceChildren();

  const gEntry = G.strip.find(s => s.k === G.gUp);

  let ncaPill = null;
  G.chainNodes.forEach(n => { ncaPill = pillEl(n); rowEl.appendChild(ncaPill); });
  if (G.gUp !== 0) mark(ncaPill, 'g', false);   /* 只能往左離開原位 ⇒ ▽ 永遠在 ▼ 右邊 */

  /* 分歧槽:即使目前沒有分岔也存在。plus 必須永遠在 ——

  if (G.fork) G.branches.forEach((b, bi) => {
    const br = el('branch');
    const dead = examples.length - b.exs.length < 2;
    const tr = el('btrash' + (dead ? ' dead' : ''), '🗑');
    tr.title = dead ? '至少要留兩個範例' : '刪掉這條走法(連同它的範例)';
    if (!dead) {
      tr.addEventListener('mouseenter', () => { if (armed()) { const r = matchesWithout(bi); if (r) setPreview(r); } });
      tr.addEventListener('mouseleave', clearPreview);

  for (let r = G.rUp - 1; r >= 0; r--) {

   用節點身分比對的話,紅框從 span 移到它的 a,8 個元素全換但每列文字一模一樣,
   畫面上會出現 8 刪 8 增的假變化。 */

  if (!preview) return matched.map(e => ({ el: e, kind: 'keep' }));
  const A = matched.map(getTxt), B = preview.map(getTxt);
  if (A.length === B.length && A.every((t, i) => t === B[i]))
    return preview.map(e => ({ el: e, kind: 'keep' }));
  const pool = new Map();
  A.forEach(t => pool.set(t, (pool.get(t) || 0) + 1));
  const rows = [];
  preview.forEach((e, i) => {
    const t = B[i];
    if (pool.get(t) > 0) { pool.set(t, pool.get(t) - 1); rows.push({ el: e, kind: 'keep' }); }
    else rows.push({ el: e, kind: 'add' });

  matched.forEach((e, i) => {

    if (rem.get(t) > 0) { rem.set(t, rem.get(t) - 1); rows.push({ el: e, kind: 'drop' }); }

}

/* ═════════ 重算 ═════════ */

/* ═════════ ▼ 拖曳 ═════════

    const r = p.getBoundingClientRect();

/* ═════════ 頁面互動 ═════════ */

    hoverEl = null; tipEl.style.display = 'none'; clearPreview(); rebuildBoxes(); return;
  }

  if (!m) return null;
  const keys = new Set(m.nodes.map(n => n.key));
  const lost = [...overrides.keys()].some(k => G.nodes.some(n => n.key === k) && !keys.has(k));

  }
  if (phase === 'add') {

    if (probe.destructive && pendingDestructive !== t) {

addEventListener('mousemove', onMove, true);
addEventListener('click', onClick, true);
addEventListener('contextmenu', onCtx, true);
addEventListener('mousedown', swallow, true);
addEventListener('mouseup', swallow, true);
addEventListener('keydown', e => { if (e.key === 'Escape' && on) $('#tool-on').click(); }, true);

/* ═════════ 輸出 ═════════ */
function anchorExpr(target) {
  let e = target; const tail = []; let up = 0;
  while (e && up < 8) {
    if (e.id) {
      const hit = evalIn('//*[@id="' + e.id + '"]', document);
      if (hit && hit.length === 1) return '//*[@id="' + e.id + '"]' + (tail.length ? '/' + tail.join('/') : '');
    }
    for (const c of e.classList) {
      if (!/^[A-Za-z][\w-]*$/.test(c)) continue;
      const x = '//*[contains(concat(" ",normalize-space(@class)," ")," ' + c + ' ")]';
      const hit = evalIn(x, document);
      if (hit && hit.length === 1) return x + (tail.length ? '/' + tail.join('/') : '');
    }
    if (!e.parentElement) break;
    tail.unshift(e.tagName.toLowerCase() + '[' + tagIdx(e) + ']');
    e = e.parentElement; up++;
  }
  return absPath(target);
}
const outputExpr = () => G ? exprOf(G, anchorExpr(G.green)) : null;

function copyText(t, okMsg) {
  const done = () => toast(okMsg);
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(done, () => fallback(t, done));
  else fallback(t, done);
}
function fallback(t, done) {
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
  ta.remove();
  ok ? done() : toast('複製失敗');
}

(() => {
  const head = panel.querySelector('.head');
  let sx = 0, sy = 0, ox = 0, oy = 0, drag = false;
  head.addEventListener('mousedown', e => {
    if (e.target.tagName === 'BUTTON') return;

    sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top; drag = true;
    e.preventDefault(); e.stopPropagation();
  }, true);
  addEventListener('mousemove', e => {
    if (!drag) return;
    panel.style.left = Math.max(4, ox + e.clientX - sx) + 'px';
    panel.style.top = Math.max(4, oy + e.clientY - sy) + 'px';
  }, true);
  addEventListener('mouseup', () => { drag = false; }, true);
})();

loadFixture('clean');
})();
</script>
