  <h1>猴子戲法: 書籤列指令</h1>
  <dl>
    <dt><a href="red-outline/index.html">紅框標註</a></dt>
    <dd>在做網頁截圖的時候，時常需要標註特定元素<br>對於不使用簡報軟體的使用者來說，這是一個非常有用的工具<br>
      相較於簡報軟體，還有一個優點是尺寸能自動貼齊元素</dd>

    <dt><a href="generic-parser/index.html">通用資料擷取 (紅框書籤衍生應用)</a></dt>
    <dd>使用者選取兩個參照元素(紅框)後，自動選取共同祖先元素(綠框) + 位階相仿的手足元素(藍框)<br>
      這工具設計了一套簡易的演算法，限制參照元素的選法並提供額外介面<br>
      讓使用者在限制環境下，可以任意「調整 XPath 節點表達式」或是「提高共同祖先元素層級」</dd>
  </dl>
